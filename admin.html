<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - G'Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Poppins', sans-serif; }
        .btn-pink { background-color: #d67a9e; color: #fff; border: none; font-weight: 500; }
        .btn-pink:hover { background-color: #b85c80; color: #fff; }
        .logo-img { width: 60px; height: 60px; object-fit: cover; border-radius: 50%; border: 2px solid #d4af37; box-shadow: 0 2px 8px rgba(212, 175, 55, 0.3); }
    </style>
</head>
<body>
    <div class="container my-5 py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold d-flex align-items-center gap-2">
                        <img src="logo.png" alt="G'Style Logo" class="logo-img"> Espace Admin
                    </h2>
                    <!-- Correction du bouton accès site -->
                    <a href="index.html" class="btn btn-outline-dark rounded-pill">Voir le site client <i class="fas fa-external-link-alt ms-1"></i></a>
                </div>

                <div id="alert-container"></div>

                <!-- FORMULAIRE EXISTANT INCHANGÉ -->
                <div class="card p-4 border-0 shadow-sm rounded-4 mb-4">
                    <form id="add-product-form">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Nom du produit</label>
                                <input type="text" id="prod_name" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Catégorie</label>
                                <select id="prod_category" class="form-select" required>
                                    <option value="vetements">Vêtements</option>
                                    <option value="chaussures">Chaussures</option>
                                    <option value="beaute">Outils de beauté</option>
                                    <option value="bijoux">Bijoux</option>
                                    <option value="sacs">Sacs</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Prix (FCFA)</label>
                                <input type="number" id="prod_price" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Image</label>
                                <input type="file" id="prod_image_file" class="form-control" accept="image/*" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Description</label>
                                <textarea id="prod_desc" class="form-control" rows="3"></textarea>
                            </div>
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-pink px-5 py-3 rounded-pill fw-bold w-100">Enregistrer le produit</button>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- NOUVELLE ZONE DE GESTION (Suppression) -->
                <div class="card p-4 border-0 shadow-sm rounded-4">
                    <h5 class="fw-bold mb-3">Produits enregistrés</h5>
                    <div id="admin-product-list" class="list-group">
                        <!-- Les produits s'afficheront ici -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Fonction pour afficher la liste avec option suppression
        function updateAdminList() {
            const list = document.getElementById('admin-product-list');
            const products = JSON.parse(localStorage.getItem('gstyle_products')) || [];
            list.innerHTML = products.length ? "" : "<p class='text-muted'>Aucun produit.</p>";
            
            products.forEach((p, index) => {
                list.innerHTML += `
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <div><strong>${p.name}</strong> - ${p.price} FCFA</div>
                        <button class="btn btn-sm btn-danger" onclick="deleteProd(${index})"><i class="fas fa-trash"></i></button>
                    </div>`;
            });
        }

        function deleteProd(index) {
            let products = JSON.parse(localStorage.getItem('gstyle_products')) || [];
            products.splice(index, 1);
            localStorage.setItem('gstyle_products', JSON.stringify(products));
            updateAdminList();
        }

        // Votre script d'ajout original
        document.getElementById('add-product-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const file = document.getElementById('prod_image_file').files[0];
            const reader = new FileReader();
            reader.onload = function(event) {
                const newProduct = {
                    name: document.getElementById('prod_name').value,
                    category: document.getElementById('prod_category').value,
                    price: document.getElementById('prod_price').value,
                    image: event.target.result,
                    description: document.getElementById('prod_desc').value
                };
                let products = JSON.parse(localStorage.getItem('gstyle_products')) || [];
                products.push(newProduct);
                localStorage.setItem('gstyle_products', JSON.stringify(products));
                updateAdminList();
                this.reset();
            };
            reader.readAsDataURL(file);
        });

        updateAdminList();
    </script>
</body>
</html>
